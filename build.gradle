plugins {
	id 'dev.kikugie.loom-back-compat'
}

version = "${project.mod_version}+${stonecutter.current.version}"
base.archivesName = 'litesync'

repositories {
	maven {
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
	maven {
		url = 'https://maven.fallenbreath.me/releases'
		content { includeGroup 'me.fallenbreath' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"litesync" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Two test clients with the same name (= same UUID) but separate game directories, shared by all versions.
	runs {
		client {
			runDir "../../run"
			programArgs "--username", "LiteSyncTester"
		}
		client2 {
			client()
			configName = "Minecraft Client 2"
			runDir "../../run2"
			ideConfigGenerated true
			programArgs "--username", "LiteSyncTester"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	loomx.applyMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation project(':core')
	include project(':core')

	modImplementation "maven.modrinth:litematica:${project.litematica_version}"
	modImplementation "maven.modrinth:malilib:${project.malilib_version}"
	modImplementation "maven.modrinth:modmenu:${project.modmenu_version}"
	if (stonecutter.current.parsed < "26.1") {
		modImplementation "me.fallenbreath:conditional-mixin-fabric:0.6.4"
	}
}

processResources {
	def props = [version: project.version, minecraft: project.minecraft_compat, java_version: project.java_version]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}

}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version as int
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

// All versions put their jars into the root build/libs.
base.libsDirectory = rootProject.layout.buildDirectory.dir("libs")

jar {
	def projectName = base.archivesName.get()
	inputs.property "projectName", projectName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName" }
	}
}
